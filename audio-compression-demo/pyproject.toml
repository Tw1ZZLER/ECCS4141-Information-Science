[project]
name = "audio-compression-demo"
version = "0.1.0"
description = "Wavelet audio compression demo with a Textual TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "PyWavelets>=1.6",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "textual>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
